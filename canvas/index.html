  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/favicon-192.png">

  <link rel="stylesheet" href="../css/main.css">

<body class="canvas-page">

  <header class="case-topbar">
    <div class="case-topbar__inner">
      <div class="case-topbar__left">
        <a href="../index.html" class="case-topbar__logo" aria-label="Joyce Ren home"></a>
        <nav id="site-nav" class="case-topbar__nav" aria-label="Main">
          <a href="../index.html#work">Work</a>
          <a href="index.html" aria-current="page">Canvas</a>
          <a href="../about/index.html">About</a>
        </nav>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        Menu
      </button>
      <a href="../index.html#resume" class="case-topbar__resume">Resume</a>
    </div>
  </header>

  <main class="canvas-stage">
    <section class="canvas-gallery" aria-labelledby="canvas-title">
      <header class="canvas-gallery__intro">
        <p class="eyebrow">Canvas</p>
        <h1 class="canvas-gallery__title" id="canvas-title">studies</h1>
      </header>

      <div class="canvas-gallery__layout">
        <div class="canvas-gallery__collage" aria-label="Six image placeholders">
          <figure class="canvas-gallery__image canvas-gallery__image--one">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder one">
              <span>Image placeholder</span>
            </div>
            <figcaption>01</figcaption>
          </figure>
          <figure class="canvas-gallery__image canvas-gallery__image--two">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder two">
              <span>Image placeholder</span>
            </div>
            <figcaption>02</figcaption>
          </figure>
          <figure class="canvas-gallery__image canvas-gallery__image--three">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder three">
              <span>Image placeholder</span>
            </div>
            <figcaption>03</figcaption>
          </figure>
          <figure class="canvas-gallery__image canvas-gallery__image--four">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder four">
              <span>Image placeholder</span>
            </div>
            <figcaption>04</figcaption>
          </figure>
          <figure class="canvas-gallery__image canvas-gallery__image--five">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder five">
              <span>Image placeholder</span>
            </div>
            <figcaption>05</figcaption>
          </figure>
          <figure class="canvas-gallery__image canvas-gallery__image--six">
            <div class="canvas-gallery__placeholder" role="img" aria-label="Image placeholder six">
              <span>Image placeholder</span>
            </div>
            <figcaption>06</figcaption>
          </figure>
        </div>

        <div class="canvas-gallery__descriptors">
          <p class="canvas-gallery__label">A few descriptors</p>
          <ol class="canvas-gallery__list">
            <li>Portrait study</li>
            <li>Walking wide angle</li>
            <li>Sitting wide angle</li>
            <li>Front camera</li>
            <li>Video screenshot</li>
            <li>Mirror full body</li>
          </ol>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
