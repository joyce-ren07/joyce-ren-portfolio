<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Canvas — art and writing by Joyce Ren.">
  <title>Canvas — Joyce Ren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="canvas-page">

  <header class="case-topbar">
    <div class="case-topbar__inner">
      <div class="case-topbar__left">
        <a href="../index.html" class="case-topbar__logo" aria-label="Joyce Ren home"></a>
        <nav id="site-nav" class="case-topbar__nav" aria-label="Main">
          <a href="../index.html#work">Work</a>
          <a href="index.html" aria-current="page">Canvas</a>
          <a href="../about/index.html">About</a>
        </nav>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        Menu
      </button>
      <a href="https://drive.google.com/file/d/1AcyGdudRiKyrpiDPvpcQZ9V-Vc9OB7oW/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="case-topbar__resume">Resume</a>
    </div>
  </header>

  <main class="canvas-stage">
    <section class="canvas-gallery" aria-labelledby="canvas-title">
      <header class="canvas-gallery__intro">
        <p class="eyebrow">Canvas</p>
        <h1 class="canvas-gallery__title" id="canvas-title">studies</h1>
      </header>

      <div class="canvas-gallery__layout">
        <div class="canvas-gallery__collage" aria-label="Artwork gallery">
          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open Chinoiserie"
            data-canvas-plate
            data-title="Chinoiserie"
            data-meta="oil on canvas · 30 × 24 · 2024"
            data-index="01"
          >
            <span class="canvas-gallery__index" aria-hidden="true">01</span>
            <div class="canvas-gallery__media">
              <img src="../Chinoiserie.jpeg" alt="Chinoiserie, three figures painted on a blue-and-white porcelain dish" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">Chinoiserie</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open Cultivation/Conviction"
            data-canvas-plate
            data-title="Cultivation/Conviction"
            data-meta="oil on canvas · 24 × 12 · 2024"
            data-index="02"
          >
            <span class="canvas-gallery__index" aria-hidden="true">02</span>
            <div class="canvas-gallery__media">
              <img src="../Cultivate.jpeg" alt="Cultivation/Conviction, a portrait of a grandfather beneath a fruit tree" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">Cultivation/Conviction</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open 99 Ranch Fish Market"
            data-canvas-plate
            data-title="99 Ranch Fish Market"
            data-meta="acrylic paint, colored pencil on paper · 18 × 12 · 2022"
            data-index="03"
          >
            <span class="canvas-gallery__index" aria-hidden="true">03</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_6600.jpeg" alt="99 Ranch Fish Market, a busy fish counter beneath red lanterns" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">99 Ranch Fish Market</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open Flux"
            data-canvas-plate
            data-title="Flux"
            data-meta="oil on canvas · 14 × 11 · 2024"
            data-index="04"
          >
            <span class="canvas-gallery__index" aria-hidden="true">04</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_0051.jpeg" alt="Flux, a face and reflection rippling into one another" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">Flux</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open The Plunge!"
            data-canvas-plate
            data-title="The Plunge!"
            data-meta="charcoal, colored pencil on paper · 18 × 12 · 2023"
            data-index="05"
          >
            <span class="canvas-gallery__index" aria-hidden="true">05</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_6593.jpeg" alt="The Plunge!, a diver moving through a flooded city" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">The Plunge!</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open Untitled"
            data-canvas-plate
            data-title="Untitled"
            data-meta="colored pencil on paper · 14 × 9.5 · 2024"
            data-index="06"
          >
            <span class="canvas-gallery__index" aria-hidden="true">06</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_2220.jpeg" alt="Untitled, a figure whose head becomes a flock of birds" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">Untitled</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open Anonymous"
            data-canvas-plate
            data-title="Anonymous"
            data-meta="colored pencil on recycling paper · 18 × 12 · 2022"
            data-index="07"
          >
            <span class="canvas-gallery__index" aria-hidden="true">07</span>
            <div class="canvas-gallery__media">
              <img src="../Anonymous.jpeg" alt="Anonymous, fish-headed commuters sharing a subway car" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">Anonymous</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image canvas-gallery__image--unmatched"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open IMG_4386"
            data-canvas-plate
            data-title="IMG_4386"
            data-meta="Metadata unavailable · uploaded study"
            data-index="08"
          >
            <span class="canvas-gallery__index" aria-hidden="true">08</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_4386.jpeg" alt="Uploaded artwork showing a figure stepping from a wooden box" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">IMG_4386</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image canvas-gallery__image--unmatched"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open IMG_6074"
            data-canvas-plate
            data-title="IMG_6074"
            data-meta="Metadata unavailable · uploaded study"
            data-index="09"
          >
            <span class="canvas-gallery__index" aria-hidden="true">09</span>
            <div class="canvas-gallery__media">
              <img src="../IMG_6074.jpeg" alt="Uploaded artwork showing a figure holding a glowing candle" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">IMG_6074</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open go fish!"
            data-canvas-plate
            data-title="go fish!"
            data-meta="watercolor on paper, colored pencil · 10.5 × 8.5"
            data-index="10"
          >
            <span class="canvas-gallery__index" aria-hidden="true">10</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/untitled-fish-study.jpg" alt="go fish!, stacked fish and skeletons in watercolor and colored pencil" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">go fish!</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open airborne"
            data-canvas-plate
            data-title="airborne"
            data-meta="colored pencil on paper, paint thinner · 14 × 11"
            data-index="11"
          >
            <span class="canvas-gallery__index" aria-hidden="true">11</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/untitled-figures-study.jpg" alt="airborne, figures moving through colorful bubble trails" loading="lazy" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">airborne</strong>
              </span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <dialog class="canvas-plate-lightbox" data-canvas-plate-lightbox aria-label="Artwork detail">
    <div class="canvas-plate-lightbox__panel">
      <button type="button" class="canvas-plate-lightbox__close" data-canvas-plate-close aria-label="Close artwork">
        Close
      </button>
      <div class="canvas-plate-lightbox__visual">
        <img src="" alt="" data-canvas-plate-image>
      </div>
      <aside class="canvas-plate-lightbox__copy">
        <span class="canvas-plate-lightbox__index" data-canvas-plate-index aria-hidden="true"></span>
        <h2 class="canvas-plate-lightbox__title" data-canvas-plate-title></h2>
        <p class="canvas-plate-lightbox__meta" data-canvas-plate-meta></p>
      </aside>
    </div>
  </dialog>

  <script src="../js/main.js"></script>
</body>
</html>
