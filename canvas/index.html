<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Canvas — art and writing by Joyce Ren.">
  <title>Canvas — Joyce Ren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="canvas-page">

  <header class="case-topbar">
    <div class="case-topbar__inner">
      <div class="case-topbar__left">
        <a href="../index.html" class="case-topbar__logo" aria-label="Joyce Ren home"></a>
        <nav id="site-nav" class="case-topbar__nav" aria-label="Main">
          <a href="../index.html#work">Work</a>
          <a href="index.html" aria-current="page">Canvas</a>
          <a href="../about/index.html">About</a>
        </nav>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        Menu
      </button>
    </div>
  </header>

  <main class="canvas-stage">
    <section class="canvas-gallery" aria-label="Canvas">
      <div class="canvas-gallery__layout">
        <button type="button" class="canvas-gallery__collapse-hint" data-canvas-collapse-stack aria-hidden="true" tabindex="-1">
          Collapse
        </button>
        <div
          class="canvas-gallery__collage is-stacked"
          data-canvas-collage
          aria-label="Artwork stack"
        >
          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open chinoiserie"
            data-canvas-plate
            data-title="chinoiserie"
            data-meta="oil on canvas · 30 × 24 · 2024"
            data-description="Like the style of “Chinoiserie”, I twist traditional Chinese art forms into Western interpretation, unraveling individuality against rigid custom."
            data-index="01"
          >
            <span class="canvas-gallery__index" aria-hidden="true">01</span>
            <div class="canvas-gallery__media">
              <img src="../Chinoiserie.jpeg" alt="chinoiserie, three figures painted on a blue-and-white porcelain dish" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">chinoiserie</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open cultivation/conviction"
            data-canvas-plate
            data-title="cultivation/conviction"
            data-meta="oil on canvas · 24 × 12 · 2024"
            data-description="My grandfather’s devotion to education roots the family tree, transcending life’s impermanence with the longevity of his lessons."
            data-index="02"
          >
            <span class="canvas-gallery__index" aria-hidden="true">02</span>
            <div class="canvas-gallery__media">
              <img src="../Cultivate.jpeg" alt="cultivation/conviction, a portrait of a grandfather beneath a fruit tree" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">cultivation/conviction</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open 99 ranch fish market"
            data-canvas-plate
            data-title="99 ranch fish market"
            data-meta="acrylic paint, colored pencil on paper · 18 × 12 · 2022"
            data-description="Finding solace in seafood markets, my grandfather and I take temporary refuge in these familiar spaces that harbor our taste of home."
            data-index="03"
          >
            <span class="canvas-gallery__index" aria-hidden="true">03</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/fish-market.jpg" alt="99 ranch fish market, a busy fish counter beneath red lanterns" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">99 ranch fish market</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image canvas-gallery__image--stack-front"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open flux"
            data-canvas-plate
            data-title="flux"
            data-meta="oil on canvas · 14 × 11 · 2024"
            data-description="The ripples in my transforming reflection are perpetual. Yet, what should be feared more than this disturbance – however unrelenting and unpredictable – is stagnancy."
            data-index="04"
          >
            <span class="canvas-gallery__index" aria-hidden="true">04</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/flux.jpg" alt="flux, a face and reflection rippling into one another" decoding="async" fetchpriority="high">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">flux</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open the plunge!"
            data-canvas-plate
            data-title="the plunge!"
            data-meta="charcoal, colored pencil on paper · 18 × 12 · 2023"
            data-description="Submerging into newness, I find inevitable resistance in traversing the unknown. Yet, true discovery often lies just beneath the surface of comfort – but only if I dare to plunge."
            data-index="05"
          >
            <span class="canvas-gallery__index" aria-hidden="true">05</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/the-plunge.jpg" alt="the plunge!, a diver moving through a flooded city" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">the plunge!</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open untitled"
            data-canvas-plate
            data-title="untitled"
            data-meta="colored pencil on paper · 14 × 9.5 · 2024"
            data-description="My growth is a flock of feathers and wings in restless migration, unbound to soar through impatient metamorphosis."
            data-index="06"
          >
            <span class="canvas-gallery__index" aria-hidden="true">06</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/untitled.jpg" alt="untitled, a figure whose head becomes a flock of birds" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">untitled</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open anonymous"
            data-canvas-plate
            data-title="anonymous"
            data-meta="colored pencil on recycling paper · 18 × 12 · 2022"
            data-description="An ode to our paradoxically well-acquainted strangers, with whom we intersect each day yet eternally fail to entwine."
            data-index="07"
          >
            <span class="canvas-gallery__index" aria-hidden="true">07</span>
            <div class="canvas-gallery__media">
              <img src="../Anonymous.jpeg" alt="anonymous, fish-headed commuters sharing a subway car" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">anonymous</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image canvas-gallery__image--unmatched"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open comfort zone"
            data-canvas-plate
            data-title="comfort zone"
            data-meta="Metadata unavailable · uploaded study"
            data-index="08"
          >
            <span class="canvas-gallery__index" aria-hidden="true">08</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/comfort-zone.jpg" alt="comfort zone, a figure crouched inside a wooden box" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">comfort zone</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image canvas-gallery__image--unmatched"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open dwindle"
            data-canvas-plate
            data-title="dwindle"
            data-meta="Metadata unavailable · uploaded study"
            data-index="09"
          >
            <span class="canvas-gallery__index" aria-hidden="true">09</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/dwindle.jpg" alt="dwindle, a figure lit by a glowing candle" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">dwindle</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open go fish!"
            data-canvas-plate
            data-title="go fish!"
            data-meta="watercolor on paper, colored pencil · 10.5 × 8.5"
            data-index="10"
          >
            <span class="canvas-gallery__index" aria-hidden="true">10</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/untitled-fish-study.jpg" alt="go fish!, stacked fish and skeletons in watercolor and colored pencil" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">go fish!</strong>
              </span>
            </figcaption>
          </figure>

          <figure
            class="canvas-gallery__image"
            tabindex="0"
            role="button"
            aria-haspopup="dialog"
            aria-label="Open airborne"
            data-canvas-plate
            data-title="airborne"
            data-meta="colored pencil on paper, paint thinner · 14 × 11"
            data-description="The nature of my youth, encapsulated in a similarly elusive form of childsplay. In adolescence and bubbles, there is wonder, fragility, but inevitably — impermanence."
            data-index="11"
          >
            <span class="canvas-gallery__index" aria-hidden="true">11</span>
            <div class="canvas-gallery__media">
              <img src="../assets/images/canvas/untitled-figures-study.jpg" alt="airborne, figures moving through colorful bubble trails" decoding="async">
            </div>
            <figcaption>
              <span class="canvas-gallery__caption">
                <strong class="canvas-gallery__work">airborne</strong>
              </span>
            </figcaption>
          </figure>

          <button type="button" class="canvas-gallery__expand-hint" data-canvas-expand-stack>
            View collection
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="home-footer">
    <div class="container home-footer__inner">
      <div class="home-footer__cta">
        <p class="home-footer__prompt">talk to me!</p>
        <div class="home-footer__actions">
          <a class="home-footer__email edge-glow" href="mailto:joren@ucsd.edu">
            <span class="edge-glow__bloom" aria-hidden="true"></span>
            <span class="edge-glow__ring" aria-hidden="true"></span>
            <span class="home-footer__email-text">joren@ucsd.edu</span>
          </a>
          <a class="home-footer__linkedin edge-glow" href="https://www.linkedin.com/in/joyce-ren" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <span class="edge-glow__bloom" aria-hidden="true"></span>
            <span class="edge-glow__ring" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
    <div class="container home-footer__bottom">
      <span class="home-footer__copy">© 2026 Joyce Ren</span>
    </div>
  </footer>

  <dialog class="canvas-plate-lightbox" data-canvas-plate-lightbox aria-label="Artwork detail">
    <div class="canvas-plate-lightbox__panel">
      <button type="button" class="canvas-plate-lightbox__close" data-canvas-plate-close aria-label="Close artwork">
        ×
      </button>
      <div class="canvas-plate-lightbox__visual">
        <img src="" alt="" data-canvas-plate-image>
      </div>
      <aside class="canvas-plate-lightbox__copy">
        <h2 class="canvas-plate-lightbox__title" data-canvas-plate-title></h2>
        <div class="canvas-plate-lightbox__meta" data-canvas-plate-meta></div>
        <p class="canvas-plate-lightbox__desc" data-canvas-plate-desc hidden></p>
      </aside>
    </div>
  </dialog>

  <script src="../js/main.js"></script>
</body>
</html>
